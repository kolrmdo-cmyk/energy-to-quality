name: smoke

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: |
          python -m py_compile scripts/run_champion.py scripts/run_proof.py
      - name: CLI help
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn numba
          python scripts/run_champion.py --help
          python scripts/run_proof.py --help
